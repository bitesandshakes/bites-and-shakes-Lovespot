
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bites & Shakes - Order Online</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff8ed;color:#302016}
header{background:#302016;color:white;text-align:center;padding:25px 10px}
header h1{color:#ffc857;margin:0;font-size:32px}
header p{margin-bottom:0}
.hero{text-align:center;background:#ffe2aa;padding:25px 10px}
.hero h2{margin:0 0 10px}
.container{max-width:900px;margin:auto;padding:15px}
.section-title{text-align:center;color:#8a3f18;margin:25px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.item{background:white;padding:16px 10px;text-align:center;border-radius:14px;box-shadow:0 3px 10px #0001}
.item h3{font-size:16px;min-height:36px}
.price{font-weight:bold;color:#a64d1c;font-size:19px}
button{border:0;background:#9b431b;color:white;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
.item button{margin-top:10px}
.cart{background:white;padding:18px;border-radius:14px;margin-top:25px;box-shadow:0 3px 10px #0001}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:10px}
.qty button{padding:5px 10px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.order-btn{width:100%;background:#168b48;font-size:17px;padding:14px;margin-top:10px}
footer{background:#302016;color:white;text-align:center;padding:20px;margin-top:30px}
</style>
</head>

<body>

<header>
<h1>BITES & SHAKES</h1>
<p>Fresh Food • Tasty Moments</p>
</header>

<div class="hero">
<h2>Welcome to Bites & Shakes!</h2>
<p>Order your favourite food online</p>
<strong>Melapalayam Free Delivery</strong>
</div>

<div class="container">

<h2 class="section-title">Our Food Menu</h2>
<div class="menu" id="menu"></div>

<div class="cart">
<h2>Your Cart 🛒</h2>
<div id="cartItems">Your cart is empty.</div>
<h2>Total: ₹<span id="total">0</span></h2>

<h2>Delivery Details</h2>

<label>Your Name</label>
<input id="customer" placeholder="Enter your name">

<label>Mobile Number</label>
<input id="phone" type="tel" placeholder="Enter mobile number">

<label>Delivery Address</label>
<textarea id="address" rows="3" placeholder="Enter your full address"></textarea>

<label>Payment Method</label>
<select id="payment">
<option>Cash on Delivery</option>
</select>

<button class="order-btn" onclick="placeOrder()">
ORDER ON WHATSAPP
</button>
</div>
</div>

<footer>
<h3>BITES & SHAKES</h3>
<p>Door Delivery Available</p>
<p>Melapalayam Free Delivery</p>
<p>Contact: 7708306814</p>
</footer>

<script>
const products=[
{name:"Chicken Shawarma",price:90},
{name:"Crispy Chicken Burger",price:110},
{name:"French Fries",price:70},
{name:"Chicken Sandwich",price:90},
{name:"Milkshake",price:100},
{name:"Chicken Fried Rice",price:120},
{name:"Arabian Spl Sharja",price:140},
{name:"Falooda",price:100}
];

let cart={};

function showMenu(){
const menu=document.getElementById("menu");
menu.innerHTML="";
products.forEach((p,i)=>{
menu.innerHTML+=`
<div class="item">
<h3>${p.name}</h3>
<div class="price">₹${p.price}</div>
<button onclick="addItem(${i})">ADD TO CART</button>
</div>`;
});
}

function addItem(i){
let p=products[i];
if(!cart[i])cart[i]={qty:0};
cart[i].qty++;
showCart();
}

function changeQty(i,n){
cart[i].qty+=n;
if(cart[i].qty<=0)delete cart[i];
showCart();
}

function showCart(){
let area=document.getElementById("cartItems");
let total=0;
area.innerHTML="";

if(Object.keys(cart).length===0){
area.innerHTML="Your cart is empty.";
}

Object.keys(cart).forEach(i=>{
let p=products[i];
let qty=cart[i].qty;
total+=p.price*qty;
area.innerHTML+=`
<div class="cart-row">
<span>${p.name}<br>₹${p.price} × ${qty}</span>
<span class="qty">
<button onclick="changeQty(${i},-1)">−</button>
${qty}
<button onclick="changeQty(${i},1)">+</button>
</span>
</div>`;
});

document.getElementById("total").innerText=total;
}

function placeOrder(){
let ids=Object.keys(cart);

if(ids.length===0){
alert("Please add food items first!");
return;
}

let name=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();

if(!name||!phone||!address){
alert("Please fill all delivery details!");
return;
}

if(!/^[0-9]{10}$/.test(phone)){
alert("Enter a valid 10-digit mobile number!");
return;
}

let total=0;
let msg="*NEW ORDER - BITES & SHAKES*%0A%0A";
msg+="Name: "+encodeURIComponent(name)+"%0A";
msg+="Phone: "+encodeURIComponent(phone)+"%0A";
msg+="Address: "+encodeURIComponent(address)+"%0A%0A";
msg+="*ORDER ITEMS*%0A";

ids.forEach(i=>{
let p=products[i];
let qty=cart[i].qty;
total+=p.price*qty;
msg+=encodeURIComponent(p.name)+" x "+qty+" = Rs."+(p.price*qty)+"%0A";
});

msg+="%0A*TOTAL: Rs."+total+"*%0A";
msg+="Payment: Cash on Delivery";

window.open("https://wa.me/917708306814?text="+msg,"_blank");
}

showMenu();
</script>

</body>
</html>
